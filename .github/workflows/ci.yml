name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint (syntax, undefined names, unused imports, Python 3.10 compatibility)
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (numpy + pandas only; the optional extras are tested in a separate job)
        run: pip install numpy pandas
      - name: Unit tests
        working-directory: tests
        run: python -W error::DeprecationWarning:algoplatform -m unittest discover -p "test_*.py" -v

  optional-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas cryptography
      - name: Unit tests with cryptography installed (encrypted credential vault path)
        working-directory: tests
        run: python -m unittest discover -p "test_*.py"

  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true            # informational until the codebase is fully annotated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mypy numpy pandas pandas-stubs
      - run: mypy src/algoplatform
