[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algoplatform"
version = "0.2.0"
description = "Modular algorithmic trading platform: brokers, OMS, risk, strategies, quant research, learning, backtesting, optimisation, analytics, governance"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
security = ["cryptography>=42"]
llm = ["anthropic"]                 # only for sentiment.anthropic_completer; nothing else imports it
ib = ["ib_async"]                   # only for data.IBClient (Interactive Brokers history through TWS / IB Gateway)

[project.scripts]
algoplatform = "algoplatform.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"algoplatform.web" = ["static/*"]

[tool.ruff]
target-version = "py310"
line-length = 140

[tool.ruff.lint]
# Blocking set: syntax errors, undefined names, unused imports/variables, redefinitions, mutable defaults.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841", "B006"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]                                    # re-exports are the point of an __init__
"tests/*" = ["F841"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["tests"]
